name: Veille YouTube Biotech

on:
  schedule:
    # Tous les jours à 6h00 UTC, soit 7h (hiver) ou 8h (été) à Paris
    - cron: "0 6 * * *"
  workflow_dispatch: # permet aussi un lancement manuel depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour enregistrer le CSV mis à jour dans le dépôt

# Une seule collecte à la fois : évite deux mises à jour concurrentes du CSV
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v5

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le script de veille
        env:
          # Le secret est injecté comme variable d'environnement,
          # lue dans le script par os.environ.get("YOUTUBE_API_KEY")
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python veille_youtube_biotech.py

      - name: Publier les nouvelles vidéos sur le site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/veille_biotech.csv
          if git diff --cached --quiet; then
            echo "Aucune nouvelle vidéo aujourd'hui."
          else
            git commit -m "Veille du $(date +%F) : mise à jour des vidéos"
            # Intègre d'éventuels changements poussés pendant la collecte
            git pull --rebase origin main
            git push
          fi

      - name: Sauvegarder le CSV comme artefact
        uses: actions/upload-artifact@v5
        with:
          name: veille-biotech-${{ github.run_id }}
          path: docs/veille_biotech.csv
          retention-days: 90
