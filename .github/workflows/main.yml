name: Veille YouTube Biotech

on:
  schedule:
    # Tous les lundis à 8h00 UTC (cron GitHub = toujours en UTC)
    - cron: "0 8 * * 1"
  workflow_dispatch: # permet aussi un lancement manuel depuis l'onglet Actions

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas google-api-python-client

      - name: Exécuter le script de veille
        env:
          # Le secret est injecté comme variable d'environnement,
          # lue dans le script par os.environ.get("YOUTUBE_API_KEY")
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python veille_youtube_biotech.py

      - name: Sauvegarder le CSV comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: veille-biotech-${{ github.run_id }}
          path: veille_biotech.csv
          retention-days: 90
