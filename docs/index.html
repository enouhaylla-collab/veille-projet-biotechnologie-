<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioTube</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;800&display=swap">
<style>
  :root {
    --ground: #EEF5FB;
    --surface: #FFFFFF;
    --mist: #DCEBF7;
    --sky: #A9CDEB;
    --lagoon: #6FA6D6;
    --ink: #1D3A5C;
    --muted: #5F7C9B;
    --shadow: 0 1px 2px rgba(29, 58, 92, .06), 0 8px 24px -12px rgba(29, 58, 92, .18);
    --veil: 238, 245, 251;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1A28;
      --surface: #15263A;
      --mist: #1D3350;
      --sky: #35587E;
      --lagoon: #8DBCE6;
      --ink: #E3EEF8;
      --muted: #97B0CA;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
      --veil: 14, 26, 40;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1A28;
    --surface: #15263A;
    --mist: #1D3350;
    --sky: #35587E;
    --lagoon: #8DBCE6;
    --ink: #E3EEF8;
    --muted: #97B0CA;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
    --veil: 14, 26, 40;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 15px/1.5 "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 16px;
    min-height: 100vh;
  }
  /* Fond : photo de mer fixe, sous un voile qui s'épaissit vers le bas
     pour garder les titres et les cartes lisibles.
     Photo : ekrem osmanoglu, Unsplash (licence Unsplash). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg,
        rgba(var(--veil), .10) 0%,
        rgba(var(--veil), .25) 50%,
        rgba(var(--veil), .40) 100%),
      url("https://images.unsplash.com/photo-1781877771088-2105e6fb7a0e?auto=format&fit=crop&w=2200&q=75") center / cover no-repeat,
      var(--ground);
  }
  .card h3, .section-head h2 { text-shadow: 0 1px 0 rgba(var(--veil), .6); }
  .photo-credit a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 56px 72px; }

  header { display: grid; gap: 14px; margin-bottom: 36px; }
  /* Logo BioTube : « Bio » bleu sur blanc, « Tube » blanc sur bleu,
     dans un rectangle aux angles arrondis. Couleurs fixes dans les deux thèmes. */
  .logo {
    --logo-blue: #3B7CC4;
    justify-self: start;
    display: inline-flex;
    margin: 0;
    border: 3px solid var(--logo-blue);
    border-radius: 18px;
    overflow: hidden;
    font: 800 clamp(44px, 7vw, 76px)/1 "Figtree", system-ui, sans-serif;
    letter-spacing: -.02em;
    box-shadow: var(--shadow);
  }
  .logo span { padding: .1em .28em .14em; }
  .logo .bio { background: #FFFFFF; color: var(--logo-blue); }
  .logo .tube { background: var(--logo-blue); color: #FFFFFF; }

  .tools {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-top: 8px;
  }
  .tools input, .tools select {
    font: inherit; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--mist);
    border-radius: 999px;
    padding: 9px 16px;
    outline: none;
  }
  .tools input { flex: 1 1 260px; max-width: 380px; }
  .tools input:focus-visible, .tools select:focus-visible { border-color: var(--lagoon); box-shadow: 0 0 0 3px var(--mist); }
  .chip.yt-connect {
    display: inline-flex; align-items: center; gap: 8px;
    background: #3B7CC4; border-color: #3B7CC4; color: #FFFFFF;
    font-weight: 600; padding: 10px 16px;
  }
  .chip.yt-connect svg { width: 16px; height: 16px; fill: currentColor; }
  .chip.yt-connect:hover { background: #2F6AAE; border-color: #2F6AAE; }
  .chip.yt-connect[aria-pressed="true"] { background: var(--mist); border-color: var(--lagoon); color: var(--ink); }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    font: 500 14px/1.4 "Figtree", system-ui, sans-serif;
    color: var(--surface); background: var(--ink);
    border-radius: 999px; padding: 10px 18px;
    box-shadow: var(--shadow);
  }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted); cursor: pointer;
    white-space: nowrap;
  }
  .toggle input { accent-color: var(--lagoon); width: 16px; height: 16px; margin: 0; cursor: pointer; }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 28px 22px;
  }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

  .card { display: grid; gap: 12px; align-content: start; }
  .player {
    position: relative;
    aspect-ratio: 16 / 9;
    max-width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: var(--mist);
    box-shadow: var(--shadow);
  }
  .player button {
    all: unset; cursor: pointer; position: absolute; inset: 0; display: block;
  }
  .player img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .5s ease;
  }
  .player button::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(29, 58, 92, .35));
    transition: opacity .3s;
  }
  .play {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(6px);
    display: grid; place-items: center;
    box-shadow: 0 6px 20px rgba(29, 58, 92, .25);
    transition: transform .25s ease, background .25s;
  }
  .play svg { width: 20px; height: 20px; margin-left: 3px; fill: #1D3A5C; }
  .player button:hover img { transform: scale(1.04); }
  .player button:hover .play { transform: scale(1.08); background: #fff; }
  .player button:focus-visible { outline: 3px solid var(--lagoon); outline-offset: -3px; border-radius: 14px; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 500 13px/1 "Figtree", system-ui, sans-serif;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--mist);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background .2s, border-color .2s;
  }
  .chip small { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .chip:hover { border-color: var(--sky); }
  .chip[aria-pressed="true"] { background: var(--mist); border-color: var(--lagoon); }
  .chip:focus-visible { outline: 3px solid var(--lagoon); outline-offset: 2px; }

  #content { display: grid; gap: 56px; }
  .chip.more { display: block; margin: 24px auto 0; padding: 10px 20px; }
  .like {
    justify-self: start;
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 13px/1 "Figtree", system-ui, sans-serif;
    color: var(--muted); background: transparent;
    border: 1px solid var(--mist); border-radius: 999px;
    padding: 6px 12px 6px 10px; cursor: pointer;
    transition: color .2s, background .2s, border-color .2s;
  }
  .like svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform .2s; }
  .like-count { font: 600 12px/1 "Figtree", system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  .like-count:empty { display: none; }
  .like:hover { color: var(--ink); border-color: var(--sky); }
  .like[aria-pressed="true"] { color: var(--ink); background: var(--mist); border-color: var(--lagoon); }
  .like[aria-pressed="true"] svg { fill: var(--lagoon); stroke: var(--lagoon); transform: scale(1.1); }
  .like:focus-visible { outline: 3px solid var(--lagoon); outline-offset: 2px; }
  .chip-history, .chip-likes { border-style: dashed; }
  .chip-likes[aria-pressed="true"] { border-style: solid; }
  .chip-history[aria-pressed="true"] { border-style: solid; }
  .seen {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    font: 600 11.5px/1 "Figtree", system-ui, sans-serif; letter-spacing: .02em;
    color: #1D3A5C; background: rgba(255, 255, 255, .9);
    border-radius: 999px; padding: 5px 10px;
  }
  .link-btn {
    margin-left: auto;
    font: 500 13px/1 "Figtree", system-ui, sans-serif;
    color: var(--muted); background: none; border: 0; padding: 4px 0;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  .link-btn:hover { color: var(--ink); }
  .link-btn:focus-visible { outline: 3px solid var(--lagoon); outline-offset: 2px; border-radius: 4px; }
  .section-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    margin: 0 0 20px; padding-bottom: 10px;
    border-bottom: 1px solid var(--mist);
  }
  .section-head h2 {
    margin: 0;
    font: 400 clamp(26px, 3.4vw, 34px)/1.1 "Instrument Serif", Georgia, serif;
  }
  .section-head span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  .card h3 {
    margin: 0;
    font: 600 15.5px/1.35 "Figtree", system-ui, sans-serif;
    text-wrap: pretty;
    overflow-wrap: anywhere;
  }
  .meta {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .meta span + span::before { content: "·"; margin-right: 10px; color: var(--sky); }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 0; }
  footer { margin-top: 56px; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* Verre dépoli : les blocs restent lisibles au-dessus de la photo */
  header, .section-head, .card, footer, .empty {
    background: rgba(var(--veil), .80);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    backdrop-filter: blur(14px) saturate(1.2);
  }
  header { border-radius: 22px; padding: 20px; }
  .section-head { border-radius: 14px; padding: 10px 16px; border-bottom: 0; }
  .card { border-radius: 18px; padding: 10px 10px 14px; }
  .card h3, .card .meta, .card .like { margin-inline: 4px; }
  footer { border-radius: 14px; padding: 12px 16px; }
  .empty { border-radius: 14px; }

  /* Ordinateur : filtres en colonne verticale à gauche, vidéos à droite */
  @media (min-width: 900px) {
    .wrap {
      max-width: 1380px;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      column-gap: 32px;
      align-items: start;
    }
    header {
      position: sticky;
      top: calc(16px + env(safe-area-inset-top, 0px));
      max-height: calc(100vh - 32px);
      margin-bottom: 0;
      /* Logo et filtres toujours visibles : seule la liste des catégories défile */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header > * { flex: none; }
    header > .chips { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 4px 2px 0; }
    .chips .chip { padding-block: 7px; }
    #content { grid-column: 2; }
    footer { grid-column: 1 / -1; margin-top: 40px; }
    .logo { font-size: 46px; }
    .tools { flex-direction: column; align-items: stretch; }
    .tools input[type="search"], .tools select { flex: none; max-width: none; width: 100%; }
    .chip.yt-connect { justify-content: center; }
    .toggle { display: flex; align-items: flex-start; white-space: normal; line-height: 1.35; }
    .toggle input { flex: none; margin-top: 1px; }
    .toggle span { flex: 1; min-width: 0; }
    .count { margin-left: 0; }
    .chips { flex-direction: column; align-items: stretch; }
    .chips .chip { display: flex; justify-content: space-between; align-items: center; text-align: left; }
  }
  @media (min-width: 900px) and (max-width: 1240px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style></head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo" aria-label="BioTube"><span class="bio">Bio</span><span class="tube">Tube</span></h1>
    <div class="tools">
      <input id="q" type="search" placeholder="Rechercher un titre ou une chaîne…" aria-label="Rechercher">
      <select id="lang" aria-label="Langue">
        <option value="all">Toutes les langues</option>
      </select>
      <select id="sort" aria-label="Trier">
        <option value="date">Plus récentes</option>
        <option value="views">Plus vues</option>
      </select>
      <button type="button" class="chip yt-connect" id="yt-connect" aria-pressed="false">Connecter mon YouTube</button>
      <label class="toggle" for="history" title="Être connecté·e à YouTube dans ce navigateur">
        <input id="history" type="checkbox">
        <span>Ajouter à mon historique YouTube</span>
      </label>
      <span class="count" id="count"></span>
    </div>
    <nav class="chips" id="chips" aria-label="Catégories"></nav>
  </header>

  <main id="content"></main>

  <div class="toast" id="toast" role="status" hidden></div>
  <footer>Données : YouTube Data API v3 — mise à jour chaque matin via GitHub Actions<span id="updated"></span>. <span class="photo-credit">Photo de fond : <a href="https://unsplash.com/fr/@konevi" target="_blank" rel="noopener">ekrem osmanoglu</a> / <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>.</span></footer>
</div>

<script>
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L7.5 3.64A1 1 0 0 0 6 4.5z"/></svg>';

  function parseCSV(text) {
    const rows = []; let row = [], field = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') q = false;
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); field = "";
        if (row.some(v => v !== "")) rows.push(row);
        row = [];
      } else field += c;
    }
    row.push(field);
    if (row.some(v => v !== "")) rows.push(row);
    const [head, ...body] = rows;
    return body.map(r => Object.fromEntries(head.map((h, i) => [h.trim(), r[i] ?? ""])));
  }

  const decoder = document.createElement("textarea");
  const decode = s => { decoder.innerHTML = s; return decoder.value; };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const videoId = url => (url.match(/[?&]v=([\w-]{11})/) || [])[1];
  const nf = new Intl.NumberFormat("fr-FR");
  const df = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric" });

  // Classement par mots-clés, testé d'abord sur le titre puis sur la
  // description. L'ordre compte : la première catégorie trouvée l'emporte.
  // Deuxième motif : mots en arabe, japonais et chinois, testés sur le texte
  // brut (ces écritures n'ont pas de « mots » séparés par des espaces).
  const CATEGORIES = [
    ["Algues & micro-algues",
      /\b(micro-?algue|algue|alga|alghe|algen|microalg|mikroalgen|seaweed|spirulin|phytoplancton|varech|kelp)/,
      /藻|海苔|ノリ|昆布|紫菜|طحالب|الطحالب/],
    ["Biotechnologie & recherche",
      /\b(biotech|biotecnolog|cellul|cell[- ]cultur|cultured|laborat|biopsie|genetique|genetic|genom|biomarqu|bioplastique|biomasse|bioecono|recherche|research|investigac|pesquisa|ricerca|forschung|scienti|science|ciencia)/,
      /バイオ|研究|生物技术|生物科技|科研|تكنولوجيا حيوية|التكنولوجيا الحيوية|بحث|أبحاث/],
    ["Startups & innovation",
      /\b(startup|start-up|accelerat|aceler|incubat|entrepreneur|emprend|empreend|imprendit|grunder|investiss|investor|inversion)/,
      /スタートアップ|起業|创业|初创|ريادة|شركة ناشئة/],
    ["Formation & carrières",
      /\b(formation|formacion|formacao|formazione|ausbildung|module|course|curso|corso|cours|carriere|career|etudiant|student|estudiant|licence|universit|conference|webinai?re?|webinar|ingenieur)/,
      /大学|教育|講座|培训|课程|تدريب|جامعة|دورة/],
    ["Aquaculture & élevage",
      /\b(aquacult|acuicult|aquicult|acquacolt|aquakult|piscicult|piscicolt|fischzucht|elevage|farm|tilapia|crevette|camaron|camarao|gamber|shrimp|saumon|salmon|salmao|coquillage|huitre|ostrei|mytili)/,
      /養殖|养殖|استزراع|الاستزراع|مزرعة|مزارع/],
    ["Pêche & économie bleue",
      /\b(peche|pesca|fischerei|fisher|fishing|halieut|economie bleue|economia azul|blue economy|ocean|maritime|maritim|mer\b|meer|marin)/,
      /漁業|漁|渔业|渔|海洋|صيد|بحر|البحر|الأسماك/],
  ];
  const AUTRES = "Autres sujets";
  const norm = s => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
  function categorize(title, description) {
    for (const raw of [title, description]) {
      const text = norm(raw);
      const hit = CATEGORIES.find(([, latin, other]) => latin.test(text) || other.test(raw));
      if (hit) return hit[0];
    }
    return AUTRES;
  }
  const ORDER = [...CATEGORIES.map(c => c[0]), AUTRES];

  // Langue : celle déclarée sur YouTube si présente, sinon devinée à partir
  // de l'alphabet puis des petits mots les plus courants de chaque langue.
  const LANGUES = { fr: "Français", en: "Anglais", es: "Espagnol", pt: "Portugais", de: "Allemand", it: "Italien", ar: "Arabe", ru: "Russe", zh: "Chinois", ja: "Japonais", ko: "Coréen", hi: "Hindi" };
  const AUTRE_LANGUE = "autre";
  const SCRIPTS = [
    ["ar", /[؀-ۿ]/g], ["ru", /[Ѐ-ӿ]/g], ["hi", /[ऀ-ॿ]/g],
    ["ko", /[가-힯]/g], ["ja", /[぀-ヿ]/g], ["zh", /[一-鿿]/g],
  ];
  const MOTS_OUTILS = Object.fromEntries(Object.entries({
    fr: "le la les des du de et un une pour dans sur est avec au aux nous vous ce qui que l d comme par plus sont ou son ses",
    en: "the and of to in is for with on how what are this that from by your we you it",
    es: "el los las del y en para con por una que es como su se más",
    pt: "o os as do da dos das e em para com uma que não é como mais",
    de: "der die das und ist mit für von den ein eine auf nicht wie",
    it: "il lo gli della delle e di per con una che è sono come più",
  }).map(([code, words]) => [code, new Set(words.split(" "))]));
  function detectLang(title, description) {
    const text = `${title} ${title} ${description}`.toLowerCase(); // le titre compte double
    const letters = (text.match(/\p{L}/gu) || []).length || 1;
    for (const [code, re] of SCRIPTS) {
      if ((text.match(re) || []).length / letters > 0.3) return code;
    }
    // Découpage Unicode : « l'économie » donne « l » + « économie »
    const words = text.split(/[^\p{L}]+/u);
    let best = AUTRE_LANGUE, bestScore = 1;
    for (const [code, set] of Object.entries(MOTS_OUTILS)) {
      const score = words.filter(w => set.has(w)).length;
      if (score > bestScore) { best = code; bestScore = score; }
    }
    return best;
  }
  function langOf(declared, title, description) {
    const code = (declared || "").toLowerCase().split("-")[0];
    return LANGUES[code] ? code : detectLang(title, description);
  }
  const langLabel = code => LANGUES[code] || "Autres langues";

  let videos = [];
  let activeCat = "all";
  const APERCU = 6; // vidéos par catégorie dans la vue « Toutes »

  // seenAt : date de visionnage, passée seulement dans la vue Historique
  const card = (v, seenAt) => `
      <article class="card">
        <div class="player">
          <button type="button" data-id="${v.id}" aria-label="Lire : ${esc(v.title)}">
            <img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="" loading="lazy">
            <span class="play">${PLAY}</span>
            ${!seenAt && isSeen(v.id) ? `<span class="seen">Vue</span>` : ""}
          </button>
        </div>
        <h3>${esc(v.title)}</h3>
        <div class="meta">
          <span>${esc(v.channel)}</span>
          ${seenAt
            ? `<span>Vue le ${seenFmt.format(seenAt)}</span>`
            : `<span>${nf.format(v.views)} vues</span>
          <span>${isNaN(v.date) ? "" : df.format(v.date)}</span>`}
        </div>
        <button type="button" class="like" data-like="${v.id}" aria-pressed="${isLiked(v.id)}">
          ${HEART}<span>${isLiked(v.id) ? "Aimée" : "J'aime"}</span>
          <small class="like-count">${likeCounts[v.id] ? nf.format(likeCounts[v.id]) : ""}</small>
        </button>
      </article>`;
  const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.6-9.2C1 8.2 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.7 0 5.6 3.7 4.2 6.8-2.1 4.6-9.6 9.2-9.6 9.2z"/></svg>';

  const plural = n => `${n} vidéo${n > 1 ? "s" : ""}`;

  // Historique des vidéos lancées sur le site, gardé dans ce navigateur
  const HISTORY_KEY = "watchHistory";
  const HISTORY_MAX = 300;
  const seenFmt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
  let watched = [];
  try { watched = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch {}
  const isSeen = id => watched.some(w => w.id === id);

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(watched)); } catch {}
  }
  function addToHistory(v) {
    // On garde titre et chaîne : la vidéo reste affichable même si elle
    // disparaît un jour du CSV.
    const entry = { id: v.id, title: v.title, channel: v.channel, views: v.views,
      date: isNaN(v.date) ? "" : v.date.toISOString(), at: Date.now() };
    watched = [entry, ...watched.filter(w => w.id !== v.id)].slice(0, HISTORY_MAX);
    saveHistory();
  }
  // Retrouve les vidéos d'une liste enregistrée (historique ou J'aime)
  function resolveSaved(entries, term) {
    return entries
      .map(w => ({ ...(videos.find(v => v.id === w.id) || { ...w, date: new Date(w.date), lang: detectLang(w.title, "") }), at: w.at }))
      .filter(v => !term || norm(v.title + " " + v.channel).includes(term));
  }
  const historyList = term => resolveSaved(watched, term);

  // Vidéos aimées, gardées dans ce navigateur (la plus récente en premier)
  const LIKES_KEY = "likedVideos";
  let liked = [];
  try { liked = JSON.parse(localStorage.getItem(LIKES_KEY)) || []; } catch {}
  const isLiked = id => liked.some(w => w.id === id);
  function toggleLike(v) {
    if (isLiked(v.id)) {
      liked = liked.filter(w => w.id !== v.id);
    } else {
      liked = [{ id: v.id, title: v.title, channel: v.channel, views: v.views,
        date: isNaN(v.date) ? "" : v.date.toISOString(), at: Date.now() }, ...liked];
    }
    try { localStorage.setItem(LIKES_KEY, JSON.stringify(liked)); } catch {}
  }

  // Compteur partagé entre tous les visiteurs (base Supabase). La clé
  // publique ne permet que de lire les compteurs et d'ajouter/retirer 1.
  const SUPABASE_URL = "https://begkwwqvigvckrzyjsbm.supabase.co/rest/v1";
  const SUPABASE_KEY = "sb_publishable_h8ARqgk9qPDxwX9O6wNpGg_Q036-NIF";
  const supaHeaders = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
  let likeCounts = {};

  async function loadLikeCounts() {
    try {
      const r = await fetch(`${SUPABASE_URL}/likes?select=video_id,count&count=gt.0`, { headers: supaHeaders });
      if (!r.ok) return;
      likeCounts = Object.fromEntries((await r.json()).map(x => [x.video_id, x.count]));
      document.querySelectorAll("button[data-like]").forEach(b => showCount(b.dataset.like));
    } catch {}
  }
  async function sendLike(id, delta) {
    try {
      const r = await fetch(`${SUPABASE_URL}/rpc/like_video`, {
        method: "POST", headers: supaHeaders, body: JSON.stringify({ vid: id, delta }),
      });
      if (r.ok) { likeCounts[id] = await r.json(); showCount(id); }
    } catch {}
  }
  // J'aime envoyés sur le compte YouTube de la personne connectée (OAuth
  // Google). Le site ne reçoit qu'un jeton temporaire, jamais le mot de passe.
  const GOOGLE_CLIENT_ID = "87563885145-ittc4s0n5ijqrv2kr0j8f8s42h1g2uns.apps.googleusercontent.com";
  const YT_SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl";
  let ytToken = null, ytTokenExpires = 0, tokenClient = null, pendingToken = null;
  let ytWanted = false;
  try { ytWanted = localStorage.getItem("ytConnect") === "1"; } catch {}

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { el.hidden = true; }, 3500);
  }
  function setYtButton() {
    const btn = document.getElementById("yt-connect");
    btn.setAttribute("aria-pressed", ytWanted);
    btn.innerHTML = `${PLAY}<span>${ytWanted ? "YouTube connecté ✓" : "Connecter mon YouTube"}</span>`;
  }
  // Doit être appelé pendant un clic : Google ouvre alors sa fenêtre de connexion
  function getYtToken() {
    if (ytToken && Date.now() < ytTokenExpires) return Promise.resolve(ytToken);
    if (!window.google?.accounts?.oauth2) return Promise.reject(new Error("Connexion Google indisponible, réessayez."));
    tokenClient ??= google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: YT_SCOPE,
      callback: resp => {
        if (resp.error) return pendingToken?.reject(new Error("Connexion YouTube refusée."));
        ytToken = resp.access_token;
        ytTokenExpires = Date.now() + (resp.expires_in - 60) * 1000;
        pendingToken?.resolve(ytToken);
      },
      error_callback: () => pendingToken?.reject(new Error("Fenêtre de connexion fermée.")),
    });
    return new Promise((resolve, reject) => {
      pendingToken = { resolve, reject };
      // Première fois : écran de consentement par défaut ; ensuite, sans redemander
      if (ytToken) tokenClient.requestAccessToken({ prompt: "" });
      else tokenClient.requestAccessToken();
    });
  }
  async function rateOnYouTube(id, rating) {
    const token = await getYtToken();
    const r = await fetch(`https://www.googleapis.com/youtube/v3/videos/rate?id=${id}&rating=${rating}`, {
      method: "POST", headers: { Authorization: `Bearer ${token}` },
    });
    if (r.status === 401) { ytToken = null; throw new Error("Session YouTube expirée, cliquez à nouveau."); }
    if (!r.ok) throw new Error("YouTube a refusé le J'aime.");
  }

  function showCount(id) {
    const n = likeCounts[id];
    document.querySelectorAll(`button[data-like="${id}"] .like-count`)
      .forEach(el => { el.textContent = n ? nf.format(n) : ""; });
  }

  // Liste des langues présentes, de la plus fréquente à la plus rare
  function fillLangSelect() {
    const select = document.getElementById("lang");
    const current = select.value;
    const counts = {};
    videos.forEach(v => { counts[v.lang] = (counts[v.lang] || 0) + 1; });
    const codes = Object.keys(counts)
      .sort((a, b) => (a === AUTRE_LANGUE) - (b === AUTRE_LANGUE) || counts[b] - counts[a]);
    select.innerHTML = `<option value="all">Toutes les langues</option>` +
      codes.map(c => `<option value="${c}">${langLabel(c)} (${counts[c]})</option>`).join("");
    select.value = codes.includes(current) ? current : "all";
  }

  function render() {
    const term = norm(document.getElementById("q").value.trim());
    const sort = document.getElementById("sort").value;
    const lang = document.getElementById("lang").value;
    const matching = videos
      .filter(v => lang === "all" || v.lang === lang)
      .filter(v => !term || norm(v.title + " " + v.channel).includes(term))
      .sort((a, b) => sort === "views" ? b.views - a.views : b.date - a.date);

    // Puces de catégories, avec le nombre de vidéos correspondant à la recherche
    const counts = Object.fromEntries(ORDER.map(c => [c, 0]));
    matching.forEach(v => counts[v.cat]++);
    const chip = (key, label, n) =>
      `<button type="button" class="chip" data-cat="${esc(key)}" aria-pressed="${activeCat === key}">${esc(label)}<small>${n}</small></button>`;
    const history = historyList(term).filter(v => lang === "all" || v.lang === lang);
    const likes = resolveSaved(liked, term).filter(v => lang === "all" || v.lang === lang);
    document.getElementById("chips").innerHTML =
      chip("all", "Toutes", matching.length) +
      ORDER.filter(c => counts[c]).map(c => chip(c, c, counts[c])).join("") +
      `<button type="button" class="chip chip-history" data-cat="history" aria-pressed="${activeCat === "history"}">Historique<small>${history.length}</small></button>` +
      `<button type="button" class="chip chip-likes" data-cat="likes" aria-pressed="${activeCat === "likes"}">J'aime<small>${likes.length}</small></button>`;

    const content = document.getElementById("content");

    if (activeCat === "likes") {
      document.getElementById("count").textContent = plural(likes.length);
      content.innerHTML = `
      <section>
        <div class="section-head"><h2>Mes vidéos aimées</h2><span>${plural(likes.length)}</span></div>
        ${likes.length
          ? `<div class="grid">${likes.map(v => card(v)).join("")}</div>`
          : `<p class="empty">${term ? `Aucune vidéo aimée ne correspond à « ${esc(term)} ».` : "Cliquez sur « J'aime » sous une vidéo pour la retrouver ici."}</p>`}
      </section>`;
      return;
    }

    if (activeCat === "history") {
      document.getElementById("count").textContent = plural(history.length);
      content.innerHTML = `
      <section>
        <div class="section-head">
          <h2>Mon historique</h2><span>${plural(history.length)}</span>
          ${watched.length ? `<button type="button" class="link-btn" data-action="clear-history">Effacer l'historique</button>` : ""}
        </div>
        ${history.length
          ? `<div class="grid">${history.map(v => card(v, v.at)).join("")}</div>`
          : `<p class="empty">${term ? `Aucune vidéo de l'historique ne correspond à « ${esc(term)} ».` : "Les vidéos que vous lancez sur ce site apparaîtront ici."}</p>`}
      </section>`;
      return;
    }

    const list = activeCat === "all" ? matching : matching.filter(v => v.cat === activeCat);
    document.getElementById("count").textContent = plural(list.length);

    if (!list.length) {
      content.innerHTML = `<p class="empty">Aucune vidéo ne correspond à « ${esc(term)} ».</p>`;
      return;
    }
    const groups = activeCat === "all" ? ORDER.filter(c => counts[c]) : [activeCat];
    // Vue « Toutes » : un aperçu par catégorie, le reste derrière un bouton
    const preview = activeCat === "all" ? APERCU : Infinity;
    content.innerHTML = groups.map(cat => {
      const items = list.filter(v => v.cat === cat);
      const more = items.length > preview
        ? `<button type="button" class="chip more" data-cat="${esc(cat)}">Voir les ${items.length} vidéos</button>`
        : "";
      return `
      <section>
        <div class="section-head"><h2>${esc(cat)}</h2><span>${plural(items.length)}</span></div>
        <div class="grid">${items.slice(0, preview).map(v => card(v)).join("")}</div>
        ${more}
      </section>`;
    }).join("");
  }

  document.getElementById("chips").addEventListener("click", e => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    activeCat = btn.dataset.cat;
    render();
  });

  document.getElementById("content").addEventListener("click", e => {
    const moreBtn = e.target.closest("button[data-cat]");
    if (moreBtn) {
      activeCat = moreBtn.dataset.cat;
      render();
      document.getElementById("chips").scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    const likeBtn = e.target.closest("button[data-like]");
    if (likeBtn) {
      // Mise à jour sur place : une vidéo en cours de lecture continue
      const id = likeBtn.dataset.like;
      const v = videos.find(x => x.id === id) || resolveSaved(liked, "").find(x => x.id === id);
      if (!v) return;
      toggleLike(v);
      const on = isLiked(id);
      document.querySelectorAll(`button[data-like="${id}"]`).forEach(b => {
        b.setAttribute("aria-pressed", on);
        b.querySelector("span").textContent = on ? "Aimée" : "J'aime";
      });
      const counter = document.querySelector(".chip-likes small");
      if (counter) counter.textContent = liked.length;
      // Affichage immédiat, puis valeur exacte renvoyée par Supabase
      likeCounts[id] = Math.max((likeCounts[id] || 0) + (on ? 1 : -1), 0);
      showCount(id);
      sendLike(id, on ? 1 : -1);
      if (ytWanted) {
        rateOnYouTube(id, on ? "like" : "none")
          .then(() => toast(on ? "J'aime ajouté sur YouTube" : "J'aime retiré de YouTube"))
          .catch(err => toast(err.message));
      }
      return;
    }
    if (e.target.closest("[data-action='clear-history']")) {
      if (confirm("Effacer tout l'historique de ce navigateur ? Cette action est définitive.")) {
        watched = [];
        saveHistory();
        render();
      }
      return;
    }
    const btn = e.target.closest("button[data-id]");
    if (!btn) return;

    // Enregistre la lecture sans tout redessiner (la vidéo doit continuer)
    const v = videos.find(x => x.id === btn.dataset.id) || historyList("").find(x => x.id === btn.dataset.id);
    if (v) {
      addToHistory(v);
      const counter = document.querySelector(".chip-history small");
      if (counter) counter.textContent = watched.length;
    }

    const iframe = document.createElement("iframe");
    // Lecteur standard : la lecture compte dans l'historique du compte
    // YouTube connecté dans ce navigateur. Sinon, lecteur sans cookies.
    const host = historyBox.checked ? "www.youtube.com" : "www.youtube-nocookie.com";
    iframe.src = `https://${host}/embed/${btn.dataset.id}?autoplay=1&rel=0`;
    iframe.title = btn.getAttribute("aria-label");
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    btn.replaceWith(iframe);
  });
  // Choix mémorisé dans ce navigateur uniquement
  const historyBox = document.getElementById("history");
  try { historyBox.checked = localStorage.getItem("ytHistory") === "1"; } catch {}
  historyBox.addEventListener("change", () => {
    try { localStorage.setItem("ytHistory", historyBox.checked ? "1" : "0"); } catch {}
  });

  setYtButton();
  document.getElementById("yt-connect").addEventListener("click", () => {
    if (ytWanted) {
      // Déconnexion : on révoque le jeton côté Google
      if (ytToken) google.accounts.oauth2.revoke(ytToken, () => {});
      ytToken = null;
      ytWanted = false;
      try { localStorage.setItem("ytConnect", "0"); } catch {}
      setYtButton();
      toast("YouTube déconnecté");
      return;
    }
    getYtToken()
      .then(() => {
        ytWanted = true;
        try { localStorage.setItem("ytConnect", "1"); } catch {}
        setYtButton();
        toast("YouTube connecté : vos J'aime seront aussi envoyés sur YouTube");
      })
      .catch(err => toast(err.message));
  });

  document.getElementById("q").addEventListener("input", render);
  document.getElementById("sort").addEventListener("change", render);
  document.getElementById("lang").addEventListener("change", render);

  function load(text) {
    text = text.replace(/^\uFEFF/, "");
    videos = parseCSV(text)
      .map(r => ({
        id: videoId(r.URL || ""),
        title: decode(r.Titre || ""),
        channel: decode(r["Chaîne"] || ""),
        views: Number(r.Vues) || 0,
        date: new Date(r.Date),
        cat: categorize(decode(r.Titre || ""), decode(r.Description || "")),
        lang: langOf(r.Langue, decode(r.Titre || ""), decode(r.Description || "")),
      }))
      .filter(v => v.id);
    fillLangSelect();
    render();
    loadLikeCounts();
  }

  // Charge le CSV publié à côté de la page (mis à jour chaque jour)
  fetch("veille_biotech.csv", { cache: "no-store" })
    .then(r => {
      if (!r.ok) return Promise.reject();
      const modified = new Date(r.headers.get("last-modified"));
      if (!isNaN(modified)) document.getElementById("updated").textContent = ` · dernière mise à jour le ${seenFmt.format(modified)}`;
      return r.text();
    })
    .then(load)
    .catch(() => {
      document.getElementById("content").innerHTML = `<p class="empty">Impossible de charger les vidéos. Ouvrez le site en ligne : <a href="https://enouhaylla-collab.github.io/veille-projet-biotechnologie-/">enouhaylla-collab.github.io/veille-projet-biotechnologie-</a></p>`;
    });
</script>
</body>
</html>
